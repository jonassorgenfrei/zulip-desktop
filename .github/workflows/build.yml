name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-msi
            os: windows-latest
            args: --win msi --x64
          - name: linux-x86_64-appimage
            os: ubuntu-latest
            args: --linux AppImage --x64
          - name: macos-x64-dmg
            os: macos-15-intel
            args: --mac dmg --x64
    runs-on: ${{ matrix.os }}
    env:
      # This fork has no signing certificates; do not look for a macOS
      # signing identity in the keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          # Do not restore caches into release builds (cache poisoning).
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Remove upstream Azure Trusted Signing configuration
        if: runner.os == 'Windows'
        run: |
          node -e "
            const fs = require('node:fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            delete p.build.win.azureSignOptions;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
      - run: pnpm exec install-electron
      - run: pnpm exec electron-vite build
      - env:
          EB_ARGS: ${{ matrix.args }}
        run: |
          # EB_ARGS holds multiple arguments; word splitting is intended.
          # shellcheck disable=SC2086
          pnpm exec electron-builder $EB_ARGS --publish never
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.msi
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: error
